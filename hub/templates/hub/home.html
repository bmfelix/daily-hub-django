{% extends "hub/base.html" %}
{% load static %}

{% block title %}Home{% endblock %}

{% block content %}
  <h1>Your day at a glance</h1>
  <p class="lead">Pick a module from the menu or below.</p>

  <div class="cards">
    {% for card in cards %}
      <div class="card">
        <h2><a class="card-link" href="{% url 'hub:'|add:card.module.slug %}">{{ card.module.title }}</a></h2>
        {% include card.template %}
      </div>
    {% endfor %}
  </div>

  <script src="{% static 'hub/live.js' %}" defer></script>
{% endblock %}
