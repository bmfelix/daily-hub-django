{% if error %}
  <p>{{ error }}</p>
{% elif items %}
  <ul class="card-mini-list">
    {% for item in items|slice:":4" %}
      <li><span class="number">{{ item.day|date:"M j" }}</span><span>{{ item.title }}<span class="meta"> · {% if item.all_day %}All day{% else %}{{ item.time|time:"g:i A" }}{% endif %}</span></span></li>
    {% endfor %}
  </ul>
{% else %}
  <p>Nothing on your calendars for two weeks.</p>
{% endif %}
